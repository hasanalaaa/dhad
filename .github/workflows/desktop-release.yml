name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to build, for example v1.0.18
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPATH: ".:src"
  TAURI_CLI_VERSION: "2.11.4"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout tagged source and LFS assets
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          lfs: true

      - name: Materialize Git LFS assets
        run: |
          git lfs pull
          git lfs checkout

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web_demo/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install pinned Tauri CLI
        run: |
          npm install --global @tauri-apps/cli@2.11.4
          tauri --version | grep -F "2.11.4"

      - name: Install locked Python test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Install locked web dependencies
        run: npm ci --prefix web_demo --ignore-scripts

      - name: Validate release version matches tag
        run: python tools/validate_release_version.py --root . --tag "$RELEASE_TAG"

      - name: Validate workflow structure and release wiring
        run: python tools/validate_workflows.py --root .

      - name: Stage dependency-free Tauri frontend and verify exact closure
        run: node tools/build_web_dist.mjs

      - name: Validate Tauri 2.11 configuration
        run: python tools/validate_tauri_config.py --config src-tauri/tauri.conf.json

      - name: Verify and inventory ONNX assets without mutating them
        run: python tools/optimize_onnx_assets.py --root . --write-manifest

      - name: Run release audits
        run: |
          python tools/validate_desktop_release.py --root . --strict --write-reports
          python tools/validate_sovereign_release.py --root . --skip-cleanliness --strict --write-report
          python tools/audit_repository.py

      - name: Test Python surface
        run: |
          python -m compileall -q src tests tools benchmarks
          ruff check src tests tools benchmarks gunicorn_conf.py
          pytest -q

      - name: Test JavaScript and PWA surface
        run: |
          npm run check --prefix web_demo
          npm test --prefix web_demo

      - name: Test locked Rust workspace and WASM target
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo build -p dhad-core --profile wasm-small --target wasm32-unknown-unknown --locked

  prepare-release:
    name: Create the draft release once
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Create or reuse the draft release for this tag
        id: draft
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;

            // GitHub's "get a release by tag" endpoint only returns *published*
            // releases, so a draft can never be found that way. The draft has to
            // be located through the paginated release list, which does include
            // drafts for callers with push access. Creating the draft exactly
            // once here also removes the race in which several matrix jobs each
            // create their own draft for the same tag.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const existing = releases.find((release) => release.tag_name === tag);

            if (existing && !existing.draft) {
              core.setFailed(
                `Release ${tag} is already published (id=${existing.id}); refusing to rebuild over a published release.`,
              );
              return;
            }

            let release = existing;
            if (release) {
              core.info(`Reusing draft release ${release.id} for ${tag}.`);
              const staleAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner,
                repo,
                release_id: release.id,
                per_page: 100,
              });
              for (const asset of staleAssets) {
                core.info(`Deleting stale asset ${asset.name} from the reused draft.`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            } else {
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `ضاد ${tag}`,
                body: [
                  'إصدار ضاد المكتبي لنظامي macOS وWindows.',
                  '',
                  '- macOS: Apple Silicon وIntel بصيغة DMG',
                  '- Windows: NSIS setup EXE وMSI',
                  '- المعالجة اللغوية محلية افتراضيًا',
                ].join('\n'),
                draft: true,
                prerelease: false,
                generate_release_notes: true,
              });
              release = created.data;
              core.info(`Created draft release ${release.id} for ${tag}.`);
            }

            core.setOutput('release_id', String(release.id));

  build:
    name: Build ${{ matrix.label }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon DMG
            platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            verify_arch: aarch64
            bundle: dmg
          - label: macOS Intel DMG
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
            verify_arch: x86_64
            bundle: dmg
          - label: Windows x64 NSIS
            platform: windows-2022
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
            bundle: nsis
          - label: Windows x64 MSI
            platform: windows-2022
            target: x86_64-pc-windows-msvc
            args: --verbose --target x86_64-pc-windows-msvc --bundles msi
            bundle: msi
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 100
    steps:
      - name: Checkout tagged source and LFS assets
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          lfs: true

      - name: Materialize Git LFS assets
        shell: bash
        run: |
          git lfs pull
          git lfs checkout

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web_demo/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/desktop-build-requirements.txt

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy,rustfmt
          targets: ${{ matrix.target }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.target }}

      - name: Install pinned Tauri CLI
        run: |
          npm install --global @tauri-apps/cli@2.11.4
          tauri --version | grep -F "2.11.4"

      - name: Install desktop build requirements
        run: python -m pip install --disable-pip-version-check -r tools/desktop-build-requirements.txt

      - name: Install locked web dependencies
        run: npm ci --prefix web_demo --ignore-scripts

      - name: Run Windows installer verifier strict-mode contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer-verifier.ps1

      - name: Verify VBSCRIPT support required by WiX MSI
        if: runner.os == 'Windows' && matrix.bundle == 'msi'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $feature = Get-WindowsOptionalFeature -Online -FeatureName VBSCRIPT -ErrorAction SilentlyContinue
          if ($null -ne $feature -and $feature.State -ne 'Enabled') {
            Write-Host "Enabling Windows VBSCRIPT optional feature for WiX light.exe"
            $result = Enable-WindowsOptionalFeature -Online -FeatureName VBSCRIPT -All -NoRestart
            Write-Host "VBSCRIPT state after enable request: $($result.RestartNeeded)"
          }
          $smoke = Join-Path $env:RUNNER_TEMP 'dhad-vbscript-smoke.vbs'
          Set-Content -LiteralPath $smoke -Encoding ASCII -Value 'WScript.Quit 0'
          & "$env:SystemRoot\System32\cscript.exe" //NoLogo $smoke
          if ($LASTEXITCODE -ne 0) {
            throw "VBSCRIPT smoke test failed with exit code $LASTEXITCODE"
          }
          Write-Host 'VBSCRIPT smoke test: PASS'

      - name: Validate and prepare release assets
        run: |
          python tools/validate_release_version.py --root . --tag "$RELEASE_TAG"
          python -c "from pathlib import Path; assert Path('src-tauri/tauri.windows.conf.json').is_file()"
          node tools/build_web_dist.mjs
          python tools/validate_tauri_config.py --config src-tauri/tauri.conf.json
          python tools/optimize_onnx_assets.py --root . --write-manifest
          python tools/validate_desktop_release.py --root . --strict
          python tools/validate_sovereign_release.py --root . --skip-cleanliness --strict
          npm run check --prefix web_demo
          npm test --prefix web_demo
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked

      - name: Configure optional Apple signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          DHAD_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          DHAD_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          DHAD_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          DHAD_APPLE_ID: ${{ secrets.APPLE_ID }}
          DHAD_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          DHAD_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          write_env() {
            local name="$1" value="$2" delimiter="DHAD_$(date +%s%N)_$RANDOM"
            if [[ -n "$value" ]]; then
              {
                printf '%s<<%s\n' "$name" "$delimiter"
                printf '%s\n' "$value"
                printf '%s\n' "$delimiter"
              } >> "$GITHUB_ENV"
            fi
          }

          if [[ -n "$DHAD_APPLE_CERTIFICATE" || -n "$DHAD_APPLE_CERTIFICATE_PASSWORD" || -n "$DHAD_APPLE_SIGNING_IDENTITY" ]]; then
            [[ -n "$DHAD_APPLE_CERTIFICATE" && -n "$DHAD_APPLE_CERTIFICATE_PASSWORD" && -n "$DHAD_APPLE_SIGNING_IDENTITY" ]] || {
              echo "APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, and APPLE_SIGNING_IDENTITY must be configured together." >&2
              exit 1
            }
          fi
          if [[ -n "$DHAD_APPLE_ID" || -n "$DHAD_APPLE_PASSWORD" || -n "$DHAD_APPLE_TEAM_ID" ]]; then
            [[ -n "$DHAD_APPLE_ID" && -n "$DHAD_APPLE_PASSWORD" && -n "$DHAD_APPLE_TEAM_ID" ]] || {
              echo "APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID must be configured together." >&2
              exit 1
            }
          fi

          write_env APPLE_CERTIFICATE "$DHAD_APPLE_CERTIFICATE"
          write_env APPLE_CERTIFICATE_PASSWORD "$DHAD_APPLE_CERTIFICATE_PASSWORD"
          write_env APPLE_SIGNING_IDENTITY "$DHAD_APPLE_SIGNING_IDENTITY"
          write_env APPLE_ID "$DHAD_APPLE_ID"
          write_env APPLE_PASSWORD "$DHAD_APPLE_PASSWORD"
          write_env APPLE_TEAM_ID "$DHAD_APPLE_TEAM_ID"

      - name: Build and upload bundles to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_CLI_VERSION: "2.11.4"
        with:
          tauriScript: tauri
          projectPath: src-tauri
          # Uploading by release id — never by tag — is what makes the matrix
          # deterministic: the draft already exists, so no build job creates a
          # second one and no build job depends on the draft being findable by tag.
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
          releaseAssetNamePattern: "Dhad_[version]_[platform]_[arch][setup][ext]"
          workflowArtifactNamePattern: "Dhad-[version]-[platform]-[arch]-[bundle]"
          retryAttempts: 2
          args: ${{ matrix.args }}

      - name: Preserve generated WiX diagnostics after MSI failure
        if: failure() && runner.os == 'Windows' && matrix.bundle == 'msi'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $destination = Join-Path $env:RUNNER_TEMP 'dhad-wix-diagnostics'
          Remove-Item -LiteralPath $destination -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $destination | Out-Null
          $wixRoots = Get-ChildItem -Path (Join-Path $PWD 'target') -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq 'wix' }
          foreach ($wixRoot in $wixRoots) {
            $copyTarget = Join-Path $destination ($wixRoot.FullName -replace '[:\/]', '_')
            Copy-Item -LiteralPath $wixRoot.FullName -Destination $copyTarget -Recurse -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem -LiteralPath $destination -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTimeUtc |
            Format-Table -AutoSize |
            Out-String |
            Set-Content -LiteralPath (Join-Path $destination 'inventory.txt') -Encoding UTF8
          Get-ChildItem -LiteralPath $destination -Filter main.wxs -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object {
              "===== $($_.FullName) =====" | Add-Content -LiteralPath (Join-Path $destination 'generated-main-wxs.txt') -Encoding UTF8
              Get-Content -LiteralPath $_.FullName | Add-Content -LiteralPath (Join-Path $destination 'generated-main-wxs.txt') -Encoding UTF8
            }
          Write-Host "WiX diagnostics preserved at $destination"

      - name: Upload WiX diagnostics after MSI failure
        if: failure() && runner.os == 'Windows' && matrix.bundle == 'msi'
        uses: actions/upload-artifact@v4
        with:
          name: Dhad-${{ env.RELEASE_TAG }}-wix-diagnostics
          path: ${{ runner.temp }}/dhad-wix-diagnostics
          if-no-files-found: warn
          retention-days: 30

      - name: Verify signed macOS app bundle and native launch
        if: runner.os == 'macOS'
        env:
          DHAD_EXPECTED_MACOS_ARCH: ${{ matrix.verify_arch }}
          DHAD_SKIP_MACOS_LAUNCH_SMOKE: "0"
        run: ./scripts/verify-macos-app.sh

      - name: Verify generated Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DHAD_WINDOWS_BUNDLE: ${{ matrix.bundle }}
        run: ./scripts/verify-windows-installer.ps1

  publish:
    name: Verify assets and publish release atomically
    needs: [prepare-release, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify complete installer set and publish draft
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const release_id = Number(process.env.RELEASE_ID);
            if (!Number.isInteger(release_id) || release_id <= 0) {
              core.setFailed(`prepare-release did not produce a usable release id: ${process.env.RELEASE_ID}`);
              return;
            }

            // Addressing the release by id keeps the draft reachable; the by-tag
            // endpoint only ever returns published releases.
            const { data: release } = await github.rest.repos.getRelease({ owner, repo, release_id });
            if (release.tag_name !== tag) {
              core.setFailed(`Release ${release_id} points at ${release.tag_name}, expected ${tag}.`);
              return;
            }
            if (!release.draft) {
              core.setFailed(`Release ${tag} was published before the full matrix completed.`);
              return;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id,
              per_page: 100,
            });
            const names = assets.map((asset) => asset.name);
            const lower = names.map((name) => name.toLowerCase());
            const dmgCount = lower.filter((name) => name.endsWith('.dmg')).length;
            const hasMsi = lower.some((name) => name.endsWith('.msi'));
            const hasNsis = lower.some((name) => name.endsWith('.exe'));
            const incomplete = assets.filter((asset) => asset.state !== 'uploaded');
            if (dmgCount < 2 || !hasMsi || !hasNsis) {
              core.setFailed(`Incomplete release assets for ${tag}: ${JSON.stringify(names)}`);
              return;
            }
            if (incomplete.length > 0) {
              core.setFailed(
                `Release assets for ${tag} are not fully uploaded: ${JSON.stringify(incomplete.map((asset) => asset.name))}`,
              );
              return;
            }

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id,
              draft: false,
              prerelease: false,
            });
            core.info(`Published ${tag} with ${names.length} assets: ${names.join(', ')}`);
